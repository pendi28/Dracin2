name: OTA Update — Functions Only

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Catatan update (opsional)"
        required: false
        default: "Update Cloud Functions"

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Install Functions Dependencies
        run: npm install
        working-directory: functions

      - name: Write Firebase Runtime Config
        run: |
          echo '{"admin":{"key":"${{ secrets.ADMIN_KEY }}"}}' > functions/.runtimeconfig.json

      - name: Write Service Account File
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Deploy Functions Only
        run: firebase deploy --only functions --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      - name: Print Success
        run: echo "Functions update selesai — ${{ github.event.inputs.message }}"
