name: OTA Update — Hosting Only

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Catatan update (opsional)"
        required: false
        default: "OTA update"

jobs:
  deploy-hosting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy Hosting Only
        run: firebase deploy --only hosting --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Print Success
        run: echo "OTA update selesai — ${{ github.event.inputs.message }}"
