name: OTA Update — Full Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Pilih apa yang di-deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - hosting
          - functions
          - firestore
      message:
        description: "Catatan update (opsional)"
        required: false
        default: "Manual full deploy"

jobs:
  deploy-full:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Install Functions Dependencies
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'functions' }}
        run: npm install
        working-directory: functions

      - name: Write Firebase Runtime Config
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'functions' }}
        run: |
          echo '{"admin":{"key":"${{ secrets.ADMIN_KEY }}"}}' > functions/.runtimeconfig.json

      - name: Deploy All
        if: ${{ github.event.inputs.target == 'all' }}
        run: firebase deploy --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Hosting Only
        if: ${{ github.event.inputs.target == 'hosting' }}
        run: firebase deploy --only hosting --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Functions Only
        if: ${{ github.event.inputs.target == 'functions' }}
        run: firebase deploy --only functions --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Firestore Only
        if: ${{ github.event.inputs.target == 'firestore' }}
        run: firebase deploy --only firestore --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Print Success
        run: echo "Deploy selesai [target=${{ github.event.inputs.target }}] — ${{ github.event.inputs.message }}"
