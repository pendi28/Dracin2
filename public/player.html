<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pendi Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <style>
        :root { --accent:#0d9488; --accent2:#6c63ff; --bg:#000; --card:#0f1318; --border:#1e252e; --text:#f0f4f8; --sub:#8b949e; }
        * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
        html,body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; overscroll-behavior:none; }

        /* ── Header ── */
        header {
            position:sticky; top:0; z-index:20;
            background:rgba(0,0,0,0.9); backdrop-filter:blur(12px);
            border-bottom:1px solid var(--border);
            padding:10px 14px; display:flex; align-items:center; gap:10px;
        }
        .back-btn {
            background:rgba(255,255,255,0.08); border:1px solid var(--border);
            color:var(--text); padding:7px 12px; border-radius:10px;
            text-decoration:none; font-size:0.82rem; font-weight:600; flex-shrink:0;
        }
        #headerTitle { font-size:0.9rem; font-weight:700; flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
        #qualitySelect {
            background:rgba(255,255,255,0.08); border:1px solid var(--border); color:var(--text);
            border-radius:8px; padding:6px 10px; font-size:0.75rem; cursor:pointer; outline:none; flex-shrink:0;
        }

        /* ── Video Container ── */
        :root { --plyr-color-main:#0d9488; }
        .player-wrap {
            position:relative; width:100%; background:#000;
            /* Vertical 9:16 untuk drama portrait */
            aspect-ratio:9/16; max-height:85vh; overflow:hidden;
            touch-action:pan-y;
        }
        .player-wrap video,
        .player-wrap .plyr,
        .player-wrap .plyr--video,
        .player-wrap .plyr__video-wrapper {
            width:100% !important; height:100% !important;
        }
        .player-wrap video { object-fit:contain; background:#000; display:block; }

        /* Swipe hint */
        .swipe-hint {
            position:absolute; top:50%; right:10px; transform:translateY(-50%);
            display:flex; flex-direction:column; align-items:center; gap:4px;
            z-index:4; pointer-events:none; opacity:0; transition:opacity 0.3s;
        }
        .swipe-hint.show { opacity:1; }
        .swipe-arrow { font-size:1.4rem; color:rgba(255,255,255,0.6); }

        /* ── Overlay ── */
        #player-overlay {
            position:absolute; inset:0; z-index:5;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            background:rgba(0,0,0,0.75); gap:12px; text-align:center; padding:24px;
        }
        #player-overlay.hidden { display:none; }
        #overlay-icon { font-size:2.8rem; }
        #overlay-msg  { font-size:0.85rem; color:#ccc; max-width:260px; line-height:1.6; }
        .overlay-btns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
        .overlay-btns button {
            padding:8px 18px; border:none; border-radius:10px; font-weight:700;
            cursor:pointer; font-size:0.82rem;
        }
        #btn-retry { background:var(--accent); color:#fff; }
        #btn-proxy { background:var(--accent2); color:#fff; }

        /* ── Floating controls on video ── */
        .fav-btn {
            position:absolute; right:12px; bottom:60px; z-index:6;
            background:rgba(0,0,0,0.5); border:none; border-radius:50%;
            width:44px; height:44px; font-size:1.4rem; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            transition:transform 0.2s;
        }
        .fav-btn:active { transform:scale(1.3); }
        .fav-btn.liked { color:#e5534b; }

        /* Ep nav arrows on video */
        .ep-nav-btn {
            position:absolute; z-index:6; background:rgba(0,0,0,0.45);
            border:none; color:#fff; font-size:1.2rem; cursor:pointer;
            padding:10px 8px; border-radius:10px;
        }
        #btn-prev-ep { left:8px; top:50%; transform:translateY(-50%); }
        #btn-next-ep { right:8px; top:50%; transform:translateY(-50%); }

        /* ── Info bar ── */
        .info-bar {
            background:var(--card); border-bottom:1px solid var(--border);
            padding:10px 14px; display:flex; align-items:center; gap:10px;
        }
        .info-bar .drama-title { flex:1; font-size:0.9rem; font-weight:700; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
        .now-ep { font-size:0.78rem; color:var(--accent); font-weight:600; flex-shrink:0; }

        /* ── Episode sheet ── */
        .ep-toggle-bar {
            background:var(--card); border-bottom:1px solid var(--border);
            padding:8px 14px; display:flex; align-items:center; justify-content:space-between;
        }
        .ep-toggle-bar h3 { font-size:0.82rem; color:var(--sub); font-weight:700; }
        .ep-toggle-btn {
            background:transparent; border:1px solid var(--border); color:var(--sub);
            border-radius:8px; padding:5px 12px; font-size:0.75rem; cursor:pointer;
        }
        #epCount { font-size:0.75rem; color:var(--sub); }

        .ep-section { padding:12px 14px 80px; }
        .ep-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
        @media(max-width:360px){ .ep-grid { grid-template-columns:repeat(4,1fr); } }

        .ep-btn {
            aspect-ratio:1; display:flex; align-items:center; justify-content:center;
            background:#0f1318; border:1px solid var(--border); border-radius:10px;
            cursor:pointer; font-size:0.75rem; font-weight:700; color:var(--text);
            transition:all 0.15s; position:relative;
        }
        .ep-btn:active { transform:scale(0.94); }
        .ep-btn.active { background:var(--accent); border-color:var(--accent); box-shadow:0 0 14px rgba(13,148,136,0.4); }
        .ep-btn.watched::after {
            content:''; position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
            width:14px; height:2px; background:rgba(255,255,255,0.4); border-radius:2px;
        }

        /* Resume bar */
        #resume-bar {
            background:rgba(13,148,136,0.15); border:1px solid rgba(13,148,136,0.3);
            border-radius:10px; margin:0 14px 10px; padding:10px 12px;
            display:none; align-items:center; gap:10px; font-size:0.82rem;
        }
        #resume-bar.show { display:flex; }
        #resume-info { flex:1; color:var(--text); }
        #btn-resume { background:var(--accent); border:none; color:#fff; border-radius:8px; padding:6px 14px; font-size:0.8rem; font-weight:700; cursor:pointer; }

        .state-msg { color:var(--sub); text-align:center; padding:40px 0; grid-column:1/-1; }
        .loading   { color:var(--accent); text-align:center; padding:40px 0; grid-column:1/-1; }
    </style>
</head>
<body>

<header>
    <a class="back-btn" href="index.html">← Kembali</a>
    <span id="headerTitle">Pendi Player</span>
    <select id="qualitySelect" style="display:none" onchange="changeQuality()">
        <option value="">Kualitas</option>
    </select>
</header>

<div class="player-wrap" id="playerWrap">
    <video id="mainPlayer" playsinline></video>

    <div id="player-overlay">
        <span id="overlay-icon">🎬</span>
        <span id="overlay-msg">Pilih episode untuk mulai memutar.</span>
        <div class="overlay-btns">
            <button id="btn-retry"  onclick="retryPlay()"    style="display:none">↺ Coba Lagi</button>
            <button id="btn-proxy"  onclick="playWithProxy()" style="display:none">🔀 Via Proxy</button>
        </div>
    </div>

    <!-- Favorit button -->
    <button class="fav-btn" id="favBtn" onclick="toggleFav()" title="Favorit">🤍</button>

    <!-- Prev/Next overlay -->
    <button class="ep-nav-btn" id="btn-prev-ep" onclick="prevEp()" style="display:none">❮</button>
    <button class="ep-nav-btn" id="btn-next-ep" onclick="nextEp()" style="display:none">❯</button>

    <!-- Swipe hint -->
    <div class="swipe-hint" id="swipeHint">
        <span class="swipe-arrow">▲</span>
        <span style="font-size:0.6rem;color:rgba(255,255,255,0.5)">Swipe</span>
        <span class="swipe-arrow">▼</span>
    </div>
</div>

<!-- Info bar -->
<div class="info-bar">
    <span class="drama-title" id="infoTitle">Memuat...</span>
    <span class="now-ep" id="nowEp">—</span>
</div>

<!-- Episode toggle -->
<div class="ep-toggle-bar">
    <h3>🎬 Episode <span id="epCount"></span></h3>
    <button class="ep-toggle-btn" onclick="toggleEpList()">☰ Daftar</button>
</div>

<!-- Resume bar -->
<div id="resume-bar">
    <span id="resume-info">Lanjutkan dari episode sebelumnya?</span>
    <button id="btn-resume" onclick="doResume()">▶ Lanjutkan</button>
</div>

<!-- Episode list -->
<div class="ep-section" id="epSection">
    <div class="ep-grid" id="epGrid">
        <div class="loading">⏳ Memuat episode...</div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey:"AIzaSyAbq9J5HDASVnqn13VwRAOd_u1MdEWj3bE",
    authDomain:"drama-short-668af.firebaseapp.com",
    projectId:"drama-short-668af",
    storageBucket:"drama-short-668af.firebasestorage.app",
    messagingSenderId:"216564303270",
    appId:"1:216564303270:web:13633390eb9543196a3b67"
};
const db = getFirestore(initializeApp(firebaseConfig));

const BOOK_ID = new URLSearchParams(location.search).get('id');
if (!BOOK_ID) {
    document.getElementById('infoTitle').textContent = 'Drama tidak ditemukan';
    document.getElementById('epGrid').innerHTML = '<div class="state-msg">❌ Buka dari halaman utama.</div>';
    throw new Error('No ID');
}

const DECRYPT_BASE = 'https://nb-dramabox-gentoken.vercel.app/decrypt-video?url=';
const PROGRESS_KEY = 'progress_' + BOOK_ID;
const FAV_KEY      = 'fav_' + BOOK_ID;

// ── State ──────────────────────────────────────────────────────────────────────
let chapters     = [];
let currentIndex = -1;
let usingProxy   = false;
let activeBtn    = null;
let epListOpen   = true;

// ── Resume ─────────────────────────────────────────────────────────────────────
function getProgress() { try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}'); } catch { return {}; } }
function saveProgress(idx, time, dur) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify({ epIndex:idx, time, duration:dur, ts:Date.now() }));
}

// ── Build URL ──────────────────────────────────────────────────────────────────
function buildDirectUrl(raw) { return DECRYPT_BASE + encodeURIComponent(raw); }
function buildProxyUrl(raw) {
    const base = (localStorage.getItem('pd_api')||'').replace(/\/$/,'');
    return base ? base + '/api/decrypt?url=' + encodeURIComponent(raw) : null;
}

// ── Plyr ───────────────────────────────────────────────────────────────────────
const player = new Plyr('#mainPlayer', {
    controls:['play-large','play','rewind','fast-forward','progress','current-time','duration','mute','volume','fullscreen'],
    seekTime:10, resetOnEnd:false
});

const overlayEl   = document.getElementById('player-overlay');
const overlayIcon = document.getElementById('overlay-icon');
const overlayMsg  = document.getElementById('overlay-msg');
const btnRetry    = document.getElementById('btn-retry');
const btnProxy    = document.getElementById('btn-proxy');
const favBtn      = document.getElementById('favBtn');

function showOverlay(icon,msg,retry=false,proxy=false) {
    overlayIcon.textContent = icon; overlayMsg.textContent = msg;
    btnRetry.style.display = retry ? 'block':'none';
    btnProxy.style.display = proxy ? 'block':'none';
    overlayEl.classList.remove('hidden');
}
function hideOverlay() { overlayEl.classList.add('hidden'); }

player.on('error', () => {
    if (!usingProxy) {
        showOverlay('⚠️','Video gagal dimuat.\nCoba putar via proxy atau URL mungkin kadaluarsa.',true,!!buildProxyUrl('x'));
    } else {
        showOverlay('❌','Gagal via proxy juga.\nRefresh episode di Admin Panel.',true,false);
    }
});
player.on('playing', () => { hideOverlay(); });
player.on('waiting', () => {
    overlayIcon.textContent='⏳'; overlayMsg.textContent='Buffering...';
    btnRetry.style.display='none'; btnProxy.style.display='none';
    overlayEl.classList.remove('hidden');
});

// Simpan progres tiap 5 detik
setInterval(() => {
    if (currentIndex >= 0 && player.currentTime > 2)
        saveProgress(currentIndex, player.currentTime, player.duration||0);
}, 5000);
// Tandai ep sudah ditonton saat 90% selesai
player.on('timeupdate', () => {
    if (player.duration && player.currentTime / player.duration > 0.9) {
        markWatched(currentIndex);
    }
});

// ── Play episode ───────────────────────────────────────────────────────────────
function playEpisode(index, forceProxy=false) {
    const ep = chapters[index];
    if (!ep) return;
    currentIndex = index;
    usingProxy   = forceProxy;

    // Update button
    if (activeBtn) activeBtn.classList.remove('active');
    activeBtn = document.getElementById('ep-btn-'+index);
    if (activeBtn) { activeBtn.classList.add('active'); activeBtn.scrollIntoView({behavior:'smooth',block:'nearest'}); }

    // Nav arrows
    document.getElementById('btn-prev-ep').style.display = index > 0 ? 'block':'none';
    document.getElementById('btn-next-ep').style.display = index < chapters.length-1 ? 'block':'none';

    const rawUrl = ep.rawUrl || ep.playUrl || '';
    if (!rawUrl) { showOverlay('⚠️','URL video tidak tersedia.'); return; }

    let src;
    if (forceProxy) {
        src = buildProxyUrl(rawUrl);
        if (!src) { showOverlay('⚙️','Login dulu di Admin Panel agar proxy tersedia.'); return; }
    } else {
        src = buildDirectUrl(rawUrl);
    }

    showOverlay('⏳','Memuat video...');
    document.getElementById('nowEp').textContent = `EP ${index+1}`;
    document.getElementById('headerTitle').textContent = ep.title || `Episode ${index+1}`;

    // Multi-quality
    const sources = (ep.sources||[]).filter(s=>s.rawUrl);
    const sel = document.getElementById('qualitySelect');
    if (sources.length > 1) {
        sel.style.display='block';
        sel.innerHTML = sources.map(s=>`<option value="${s.rawUrl}">${s.quality?s.quality+'p':'Auto'}</option>`).join('');
    } else { sel.style.display='none'; }

    player.source = { type:'video', sources:[{src, type:'video/mp4'}] };
    player.play().catch(()=>{});
}

function markWatched(idx) {
    const btn = document.getElementById('ep-btn-'+idx);
    if (btn) btn.classList.add('watched');
}

window.retryPlay    = () => { if(currentIndex>=0) playEpisode(currentIndex, usingProxy); };
window.playWithProxy= () => { if(currentIndex>=0) playEpisode(currentIndex, true); };
window.prevEp       = () => { if(currentIndex>0) playEpisode(currentIndex-1); };
window.nextEp       = () => { if(currentIndex<chapters.length-1) playEpisode(currentIndex+1); };

window.changeQuality = () => {
    const raw = document.getElementById('qualitySelect').value;
    if (!raw) return;
    const t = player.currentTime;
    const src = usingProxy ? (buildProxyUrl(raw)||buildDirectUrl(raw)) : buildDirectUrl(raw);
    showOverlay('⏳','Mengganti kualitas...');
    player.source = {type:'video',sources:[{src,type:'video/mp4'}]};
    player.once('loadedmetadata',()=>{ player.currentTime=t; player.play(); });
};

// ── Favorit ────────────────────────────────────────────────────────────────────
function updateFavBtn() {
    favBtn.textContent = localStorage.getItem(FAV_KEY) ? '❤️' : '🤍';
    favBtn.classList.toggle('liked', !!localStorage.getItem(FAV_KEY));
}
window.toggleFav = () => {
    if (localStorage.getItem(FAV_KEY)) localStorage.removeItem(FAV_KEY);
    else localStorage.setItem(FAV_KEY, '1');
    updateFavBtn();
};
updateFavBtn();

// ── Ep list toggle ─────────────────────────────────────────────────────────────
window.toggleEpList = () => {
    epListOpen = !epListOpen;
    document.getElementById('epSection').style.display = epListOpen ? 'block':'none';
};

// ── Swipe gestures pada player ─────────────────────────────────────────────────
let touchStartY = 0;
const wrap = document.getElementById('playerWrap');
wrap.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive:true});
wrap.addEventListener('touchend', e => {
    const dy = touchStartY - e.changedTouches[0].clientY;
    if (Math.abs(dy) > 50) {
        if (dy > 0) window.nextEp(); else window.prevEp();
    }
}, {passive:true});

// Hint swipe setelah episode pertama dimuat
function showSwipeHint() {
    const h = document.getElementById('swipeHint');
    h.classList.add('show');
    setTimeout(()=>h.classList.remove('show'),2500);
}

// ── Resume bar ─────────────────────────────────────────────────────────────────
let resumeTarget = null;
function checkResume() {
    const p = getProgress();
    if (!p.epIndex && p.epIndex !== 0) return;
    if (!p.time || p.time < 5) return;
    resumeTarget = p;
    const ep = chapters[p.epIndex];
    const min = Math.floor(p.time/60), sec = Math.floor(p.time%60);
    document.getElementById('resume-info').textContent =
        `EP ${p.epIndex+1}${ep?' · '+ep.title:''} — ${min}:${sec.toString().padStart(2,'0')}`;
    document.getElementById('resume-bar').classList.add('show');
}
window.doResume = () => {
    document.getElementById('resume-bar').classList.remove('show');
    if (!resumeTarget) return;
    playEpisode(resumeTarget.epIndex);
    player.once('loadedmetadata',()=>{
        player.currentTime = resumeTarget.time;
        player.play();
    });
};

// ── Load Firestore ─────────────────────────────────────────────────────────────
async function loadDrama() {
    const [dramaSnap, epSnap] = await Promise.all([
        getDoc(doc(db,'dramas',BOOK_ID)),
        getDoc(doc(db,'episodes',BOOK_ID))
    ]);

    if (dramaSnap.exists()) {
        const d = dramaSnap.data();
        document.getElementById('infoTitle').textContent  = d.title||'Drama';
        document.getElementById('headerTitle').textContent = d.title||'Drama';
    }

    if (!epSnap.exists()) {
        document.getElementById('epGrid').innerHTML =
            '<div class="state-msg">❌ Episode belum di-scrape.<br>Admin Panel → Scrape Drama.</div>';
        return;
    }

    chapters = epSnap.data().chapters || [];
    document.getElementById('epCount').textContent = `· ${chapters.length}`;

    const grid = document.getElementById('epGrid');
    grid.innerHTML = '';
    chapters.forEach((ep,i) => {
        const btn = document.createElement('button');
        btn.className = 'ep-btn';
        btn.id        = 'ep-btn-'+i;
        btn.textContent = ep.title || (i+1);
        btn.title       = ep.title || `Episode ${i+1}`;
        btn.addEventListener('click', ()=>playEpisode(i));
        grid.appendChild(btn);
    });

    checkResume();

    // Auto-play episode 1 jika tidak ada resume
    if (!resumeTarget) {
        setTimeout(()=>{ playEpisode(0); showSwipeHint(); }, 400);
    }
}

loadDrama().catch(e=>{
    document.getElementById('epGrid').innerHTML =
        `<div class="state-msg">❌ Gagal: ${e.message}</div>`;
});
</script>
</body>
</html>
