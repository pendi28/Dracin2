<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendi Drama</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

        header {
            padding: 16px 20px;
            border-bottom: 1px solid #21262d;
            background: rgba(13,17,23,0.95);
            backdrop-filter: blur(8px);
            position: sticky; top: 0; z-index: 10;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        header h1 { font-size: 1.2rem; font-weight: 700; color: #2dd4bf; }

        .search-bar {
            flex: 1; max-width: 400px;
            padding: 8px 14px;
            background: #161b22; border: 1px solid #30363d;
            border-radius: 8px; color: #e6edf3; font-size: 0.9rem; outline: none;
        }
        .search-bar:focus { border-color: #2dd4bf; }
        .search-bar::placeholder { color: #555; }

        .filter-bar {
            padding: 12px 20px;
            display: flex; gap: 10px; align-items: center;
            border-bottom: 1px solid #21262d;
            overflow-x: auto;
        }
        .filter-btn {
            padding: 5px 14px; border-radius: 20px; border: 1px solid #30363d;
            background: transparent; color: #8b949e; font-size: 0.8rem; cursor: pointer;
            white-space: nowrap; transition: all 0.15s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #0d9488; border-color: #0d9488; color: #fff;
        }

        .drama-count {
            padding: 12px 20px 0;
            font-size: 0.8rem; color: #555;
        }

        .drama-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
            padding: 16px 20px 40px;
        }

        .drama-card {
            background: #161b22; border: 1px solid #21262d;
            border-radius: 10px; overflow: hidden; cursor: pointer;
            transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
            text-decoration: none; color: inherit;
            display: block;
        }
        .drama-card:hover {
            transform: translateY(-3px);
            border-color: rgba(45,212,191,0.4);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .drama-thumb {
            width: 100%; aspect-ratio: 2/3; object-fit: cover;
            background: #1c2129;
        }
        .drama-thumb-placeholder {
            width: 100%; aspect-ratio: 2/3;
            background: linear-gradient(135deg, #1c2129, #0d1117);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem;
        }
        .drama-info { padding: 10px; }
        .drama-title {
            font-size: 0.82rem; font-weight: 600;
            line-height: 1.35; margin-bottom: 6px;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .drama-meta {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.72rem; color: #8b949e;
        }
        .drama-eps { color: #2dd4bf; font-weight: 600; }
        .drama-status {
            padding: 2px 7px; border-radius: 10px; font-size: 0.65rem; font-weight: 600;
        }
        .status-ongoing  { background: #14432a; color: #4ade80; }
        .status-completed { background: #1e3a5f; color: #60a5fa; }

        .state-msg {
            text-align: center; padding: 60px 20px;
            color: #555; font-size: 0.9rem;
            grid-column: 1 / -1;
        }
        .state-msg .icon { font-size: 2.5rem; margin-bottom: 12px; display: block; }
        .state-loading { color: #2dd4bf; }

        .empty-state { padding: 80px 20px; text-align: center; color: #555; }
        .empty-state span { font-size: 3rem; display: block; margin-bottom: 16px; }
    </style>
</head>
<body>

<header>
    <h1>🎬 Pendi Drama</h1>
    <input class="search-bar" type="text" id="searchInput" placeholder="Cari judul drama...">
</header>

<div class="filter-bar">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">Semua</button>
    <button class="filter-btn" data-filter="Ongoing" onclick="setFilter('Ongoing', this)">Ongoing</button>
    <button class="filter-btn" data-filter="Completed" onclick="setFilter('Completed', this)">Completed</button>
</div>

<div class="drama-count" id="dramaCount"></div>

<div class="drama-grid" id="dramaGrid">
    <div class="state-msg state-loading">
        <span class="icon">⏳</span>Memuat daftar drama...
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAbq9J5HDASVnqn13VwRAOd_u1MdEWj3bE",
        authDomain: "drama-short-668af.firebaseapp.com",
        projectId: "drama-short-668af",
        storageBucket: "drama-short-668af.firebasestorage.app",
        messagingSenderId: "216564303270",
        appId: "1:216564303270:web:13633390eb9543196a3b67"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const grid        = document.getElementById('dramaGrid');
    const searchInput = document.getElementById('searchInput');
    const countEl     = document.getElementById('dramaCount');

    let allDramas  = [];
    let activeFilter = 'all';

    function renderDramas(list) {
        countEl.textContent = `${list.length} drama ditemukan`;

        if (!list.length) {
            grid.innerHTML = `<div class="state-msg"><span class="icon">🔍</span>Tidak ada drama yang cocok.</div>`;
            return;
        }

        grid.innerHTML = '';
        list.forEach(drama => {
            const a = document.createElement('a');
            a.className = 'drama-card';
            a.href = `player.html?id=${encodeURIComponent(drama.bookId)}`;

            const statusClass = drama.status === 'Ongoing' ? 'status-ongoing' : 'status-completed';
            const statusLabel = drama.status === 'Ongoing' ? 'Ongoing' : 'Selesai';

            a.innerHTML = drama.cover
                ? `<img class="drama-thumb" src="${drama.cover}" alt="${drama.title}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=\\'drama-thumb-placeholder\\'>🎬</div>'+this.parentNode.innerHTML.replace(this.outerHTML,'')">`
                : `<div class="drama-thumb-placeholder">🎬</div>`;

            a.innerHTML += `
                <div class="drama-info">
                    <div class="drama-title">${drama.title || 'Tanpa Judul'}</div>
                    <div class="drama-meta">
                        <span class="drama-eps">${drama.totalEps || 0} Eps</span>
                        <span class="drama-status ${statusClass}">${statusLabel}</span>
                    </div>
                </div>`;
            grid.appendChild(a);
        });
    }

    function applyFilters() {
        const q = searchInput.value.trim().toLowerCase();
        let list = allDramas;
        if (activeFilter !== 'all') list = list.filter(d => d.status === activeFilter);
        if (q) list = list.filter(d => (d.title || '').toLowerCase().includes(q));
        renderDramas(list);
    }

    window.setFilter = function(filter, btn) {
        activeFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilters();
    };

    searchInput.addEventListener('input', applyFilters);

    async function loadDramas() {
        try {
            const snap = await getDocs(collection(db, 'dramas'));
            if (snap.empty) {
                grid.innerHTML = `<div class="state-msg"><span class="icon">📭</span>Belum ada drama tersimpan. Gunakan Admin Panel untuk scrape katalog.</div>`;
                countEl.textContent = '';
                return;
            }
            allDramas = snap.docs.map(d => ({ bookId: d.id, ...d.data() }));
            allDramas.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
            applyFilters();
        } catch(err) {
            grid.innerHTML = `<div class="state-msg"><span class="icon">❌</span>Gagal memuat data: ${err.message}</div>`;
        }
    }

    loadDramas();
</script>
</body>
</html>
