<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendi Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

        header {
            padding: 14px 18px; border-bottom: 1px solid #21262d;
            background: rgba(13,17,23,0.96); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; gap: 12px;
        }
        .back-btn {
            background: none; border: none; color: #2dd4bf;
            font-size: 1.4rem; cursor: pointer; padding: 4px 8px;
            border-radius: 6px; line-height: 1; display: none;
        }
        .back-btn:hover { background: rgba(45,212,191,0.1); }
        header h1 { font-size: 1.05rem; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .quality-select {
            background: #161b22; border: 1px solid #30363d; color: #e6edf3;
            border-radius: 6px; padding: 4px 8px; font-size: 0.78rem; cursor: pointer; display: none;
        }

        /* ── Browse ── */
        #browseView { padding: 16px; }
        .browse-title { font-size: 0.78rem; color: #8b949e; font-weight: 700; margin-bottom: 14px; letter-spacing: 1px; text-transform: uppercase; }
        .search-bar {
            width: 100%; padding: 9px 14px; background: #161b22;
            border: 1px solid #30363d; border-radius: 8px; color: #e6edf3;
            font-size: 0.88rem; margin-bottom: 14px; outline: none;
        }
        .search-bar:focus { border-color: #2dd4bf; }
        .drama-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .drama-card {
            border-radius: 10px; overflow: hidden; cursor: pointer;
            background: #161b22; border: 1px solid #21262d;
            transition: transform 0.15s, border-color 0.15s;
        }
        .drama-card:active { transform: scale(0.97); }
        .drama-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #21262d; display: block; }
        .drama-card .card-info { padding: 7px; }
        .drama-card .card-status {
            display: inline-block; font-size: 0.58rem; padding: 1px 5px;
            border-radius: 3px; margin-bottom: 3px;
        }
        .ongoing   { background: rgba(45,212,191,0.15); color: #2dd4bf; }
        .completed { background: rgba(139,148,158,0.15); color: #8b949e; }
        .drama-card .card-title { font-size: 0.7rem; font-weight: 600; line-height: 1.3; margin-bottom: 2px; }
        .drama-card .card-meta  { font-size: 0.62rem; color: #8b949e; }

        /* ── Player ── */
        #playerView { display: none; }
        .player-wrap { background: #000; width: 100%; position: relative; }
        .player-wrap video { width: 100%; aspect-ratio: 16/9; display: block; background: #000; }
        #videoLoading {
            position: absolute; inset: 0; display: flex; align-items: center;
            justify-content: center; background: rgba(0,0,0,0.5); display: none;
        }

        .info-bar { padding: 12px 18px; border-bottom: 1px solid #21262d; }
        .drama-name  { font-size: 0.95rem; font-weight: 700; margin-bottom: 3px; }
        .now-playing { font-size: 0.8rem; color: #2dd4bf; min-height: 18px; }

        .ep-section { padding: 14px 18px; }
        .ep-header  { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .ep-header h3 { font-size: 0.82rem; color: #8b949e; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .ep-count { font-size: 0.7rem; background: rgba(139,148,158,0.15); color: #8b949e; padding: 3px 10px; border-radius: 6px; }
        .ep-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .ep-btn {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            background: #161b22; border: 1px solid #21262d; border-radius: 9px;
            cursor: pointer; font-size: 0.72rem; font-weight: 600; color: #e6edf3;
            transition: all 0.15s; text-align: center; padding: 4px; line-height: 1.2;
        }
        .ep-btn.active  { background: #0d9488; border-color: #0d9488; box-shadow: 0 0 12px rgba(13,148,136,0.4); transform: scale(1.04); }
        .ep-btn.locked  { background: #1c1c1c; border-color: #333; color: #555; cursor: not-allowed; }

        /* ── Status ── */
        .full-loading {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 50px 0; gap: 14px; grid-column: 1/-1; color: #8b949e;
        }
        .spinner {
            width: 30px; height: 30px; border: 3px solid #21262d;
            border-top-color: #2dd4bf; border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 0.8rem; color: #2dd4bf; text-align: center; }
        .status-msg   { color: #ef4444; text-align: center; padding: 30px 10px; grid-column: 1/-1; font-size: 0.82rem; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #1c2129; border: 1px solid #30363d; color: #e6edf3;
            padding: 10px 20px; border-radius: 8px; font-size: 0.82rem;
            z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<script type="module">
import { initializeApp }       from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore,
         collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey:            "AIzaSyAbq9J5HDASVnqn13VwRAOd_u1MdEWj3bE",
    authDomain:        "drama-short-668af.firebaseapp.com",
    projectId:         "drama-short-668af",
    storageBucket:     "drama-short-668af.firebasestorage.app",
    messagingSenderId: "216564303270",
    appId:             "1:216564303270:web:13633390eb9543196a3b67"
};
const db = getFirestore(initializeApp(firebaseConfig));

// ── Elements ──────────────────────────────────────────────────────────────────
const browseView    = document.getElementById('browseView');
const playerView    = document.getElementById('playerView');
const dramaGrid     = document.getElementById('dramaGrid');
const epGrid        = document.getElementById('epGrid');
const epCountEl     = document.getElementById('epCount');
const nowPlaying    = document.getElementById('nowPlaying');
const dramaName     = document.getElementById('dramaName');
const qualitySelect = document.getElementById('qualitySelect');
const backBtn       = document.getElementById('backBtn');
const headerTitle   = document.getElementById('headerTitle');
const searchBar     = document.getElementById('searchBar');
const toastEl       = document.getElementById('toast');
const videoEl       = document.getElementById('mainPlayer');
const videoLoading  = document.getElementById('videoLoading');

let currentEp  = null;
let activeBtn  = null;
let currentCover = '';
let allDramas  = [];
let hlsInstance = null;

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg, dur = 2500) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), dur);
}

// ── HLS Player ────────────────────────────────────────────────────────────────
// Handles both native HLS (Safari) and hls.js (Chrome, Firefox, Android)
function loadVideo(src, poster = '') {
    // Destroy existing HLS instance
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

    videoEl.poster = poster;
    videoLoading.style.display = 'flex';

    const onReady = () => {
        videoLoading.style.display = 'none';
        videoEl.play().catch(() => {});
    };

    // Check if HLS.js is needed
    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
        // Use HLS.js (Chrome, Firefox, Android)
        hlsInstance = new Hls({
            enableWorker: false,
            lowLatencyMode: false,
            maxBufferLength: 30,
        });
        hlsInstance.loadSource(src);
        hlsInstance.attachMedia(videoEl);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, onReady);
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                videoLoading.style.display = 'none';
                toast('Gagal memuat video. Coba episode lain.');
                console.error('HLS fatal error', data);
            }
        });
    } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        // Native HLS support (Safari / iOS)
        videoEl.src = src;
        videoEl.addEventListener('loadedmetadata', onReady, { once: true });
    } else {
        // Fallback: try to play directly (mp4)
        videoEl.src = src;
        videoEl.addEventListener('canplay', onReady, { once: true });
    }

    videoEl.onerror = () => {
        videoLoading.style.display = 'none';
        toast('Gagal memutar video. Coba pilih episode lain.');
    };
}

// ── Navigation ────────────────────────────────────────────────────────────────
function showBrowse() {
    browseView.style.display = '';
    playerView.style.display = 'none';
    backBtn.style.display    = 'none';
    qualitySelect.style.display = 'none';
    headerTitle.textContent  = 'Pendi Player';
    videoEl.pause();
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    videoEl.src = '';
}

function showPlayer(drama) {
    browseView.style.display = 'none';
    playerView.style.display = '';
    backBtn.style.display    = 'inline-block';
    headerTitle.textContent  = drama.title;
    dramaName.textContent    = drama.title;
    nowPlaying.textContent   = 'Memuat episode...';
    epCountEl.textContent    = '';
    currentCover = drama.cover || '';
    activeBtn = null;
    qualitySelect.style.display = 'none';
    epGrid.innerHTML = `<div class="full-loading"><div class="spinner"></div><span class="loading-text">Mengambil episode...</span></div>`;
    loadEpisodes(drama.bookId, drama.lockedEpisodes || []);
}

backBtn.addEventListener('click', showBrowse);

// ── Play Episode ──────────────────────────────────────────────────────────────
function playEpisode(ep, btn) {
    if (!ep.rawUrl) { toast('Video tidak tersedia untuk episode ini.'); return; }

    currentEp = ep;
    if (activeBtn) activeBtn.classList.remove('active');
    activeBtn = btn;
    btn.classList.add('active');

    // Build quality selector
    qualitySelect.innerHTML = '';
    if (ep.sources && ep.sources.length > 0) {
        ep.sources.sort((a, b) => b.quality - a.quality).forEach(s => {
            const o = document.createElement('option');
            o.value       = `/api/decrypt?url=${encodeURIComponent(s.rawUrl)}`;
            o.textContent = s.quality + 'p';
            o.dataset.raw = s.rawUrl;
            if (s.rawUrl === ep.rawUrl) o.selected = true;
            qualitySelect.appendChild(o);
        });
        qualitySelect.style.display = 'block';
    } else {
        qualitySelect.style.display = 'none';
    }

    const src = `/api/decrypt?url=${encodeURIComponent(ep.rawUrl)}`;
    loadVideo(src, ep.thumbnailUrl || currentCover || '');
    nowPlaying.textContent = '▶ ' + ep.title;
    document.querySelector('.player-wrap').scrollIntoView({ behavior: 'smooth' });
}

// Quality change
qualitySelect.addEventListener('change', () => {
    if (!qualitySelect.value) return;
    const t = videoEl.currentTime;
    loadVideo(qualitySelect.value, videoEl.poster);
    // Restore position after load
    videoEl.addEventListener('canplay', () => { videoEl.currentTime = t; }, { once: true });
});

// ── Load Episodes ─────────────────────────────────────────────────────────────
async function loadEpisodes(bookId, lockedEpisodes) {
    try {
        const resp = await fetch(`/api/episodes/${bookId}`);
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            epGrid.innerHTML = `<div class="status-msg">Gagal memuat episode: ${err.error || resp.statusText}</div>`;
            nowPlaying.textContent = 'Gagal memuat episode.';
            return;
        }

        const chapters = await resp.json();
        if (!chapters.length) {
            epGrid.innerHTML = `<div class="status-msg">Tidak ada episode tersedia.</div>`;
            nowPlaying.textContent = 'Tidak ada episode.';
            return;
        }

        const lockedSet = new Set((lockedEpisodes || []).map(Number));
        epCountEl.textContent = chapters.length + ' Episode';
        epGrid.innerHTML = '';
        activeBtn = null;

        let firstUnlockedBtn = null;
        chapters.forEach((ep, i) => {
            const btn      = document.createElement('button');
            const isLocked = lockedSet.has(Number(ep.chapterIndex));
            btn.className  = 'ep-btn' + (isLocked ? ' locked' : '');
            btn.textContent = ep.chapterIndex || (i + 1);
            btn.title       = ep.title || `Episode ${ep.chapterIndex}`;
            if (isLocked) {
                btn.addEventListener('click', () => toast('Episode ini terkunci. 🔒'));
            } else {
                btn.addEventListener('click', () => playEpisode(ep, btn));
                if (!firstUnlockedBtn) firstUnlockedBtn = { ep, btn };
            }
            epGrid.appendChild(btn);
        });

        // Auto-play episode pertama yang tidak terkunci
        if (firstUnlockedBtn) {
            nowPlaying.textContent = 'Pilih episode untuk mulai...';
            setTimeout(() => {
                firstUnlockedBtn.btn.click();
            }, 400);
        } else {
            nowPlaying.textContent = 'Semua episode terkunci.';
        }

    } catch (err) {
        epGrid.innerHTML = `<div class="status-msg">Error: ${err.message}</div>`;
        nowPlaying.textContent = 'Terjadi kesalahan.';
    }
}

// ── Load Katalog dari Firestore ───────────────────────────────────────────────
async function loadCatalog() {
    try {
        const snap = await getDocs(collection(db, 'dramas'));
        allDramas = [];
        snap.forEach(d => allDramas.push(d.data()));
        allDramas.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
        renderCatalog(allDramas);
    } catch (err) {
        dramaGrid.innerHTML = `<div class="status-msg" style="grid-column:1/-1">Gagal memuat katalog Firestore: ${err.message}</div>`;
    }
}

function renderCatalog(list) {
    if (!list.length) {
        dramaGrid.innerHTML = `<div class="status-msg" style="grid-column:1/-1">Belum ada drama. Gunakan <a href="/admin.html" style="color:#2dd4bf">Admin Panel</a> untuk scrape katalog.</div>`;
        return;
    }
    dramaGrid.innerHTML = '';
    list.forEach(drama => {
        const card = document.createElement('div');
        card.className = 'drama-card';
        card.innerHTML = `
            <img src="${drama.cover || ''}" alt="${drama.title || ''}" loading="lazy"
                 onerror="this.style.display='none'">
            <div class="card-info">
                <span class="card-status ${drama.status === 'Ongoing' ? 'ongoing' : 'completed'}">${drama.status || ''}</span>
                <div class="card-title">${drama.title || 'Tanpa Judul'}</div>
                <div class="card-meta">${drama.totalEps ? drama.totalEps + ' ep' : ''}${drama.tags ? ' · ' + drama.tags.split(',')[0] : ''}</div>
            </div>`;
        card.addEventListener('click', () => showPlayer(drama));
        dramaGrid.appendChild(card);
    });
}

searchBar.addEventListener('input', () => {
    const q = searchBar.value.toLowerCase().trim();
    renderCatalog(q ? allDramas.filter(d => (d.title || '').toLowerCase().includes(q)) : allDramas);
});

loadCatalog();
</script>

<header>
    <button class="back-btn" id="backBtn">&#8592;</button>
    <h1 id="headerTitle">Pendi Player</h1>
    <select class="quality-select" id="qualitySelect"></select>
</header>

<!-- Browse -->
<div id="browseView">
    <div style="padding:14px 16px 0">
        <input class="search-bar" id="searchBar" type="search" placeholder="Cari drama...">
        <p class="browse-title">Daftar Drama</p>
    </div>
    <div class="drama-grid" id="dramaGrid" style="padding:0 16px 20px">
        <div class="full-loading">
            <div class="spinner"></div>
            <span class="loading-text">Memuat dari database...</span>
        </div>
    </div>
</div>

<!-- Player -->
<div id="playerView">
    <div class="player-wrap">
        <video id="mainPlayer" playsinline controls></video>
        <div id="videoLoading"><div class="spinner"></div></div>
    </div>
    <div class="info-bar">
        <div class="drama-name" id="dramaName">-</div>
        <div class="now-playing" id="nowPlaying">Memuat...</div>
    </div>
    <div class="ep-section">
        <div class="ep-header">
            <h3>Episodes</h3>
            <span class="ep-count" id="epCount"></span>
        </div>
        <div class="ep-grid" id="epGrid">
            <div class="full-loading"><div class="spinner"></div></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
