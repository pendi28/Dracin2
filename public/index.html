<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendi Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        header { padding: 16px 20px; border-bottom: 1px solid #21262d; background: rgba(13,17,23,0.9); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; }
        header h1 { font-size: 1.1rem; font-weight: 700; }
        .quality-select { margin-left: auto; background: #161b22; border: 1px solid #30363d; color: #e6edf3; border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; cursor: pointer; }
        .player-section { background: #000; width: 100%; }
        .info-section { padding: 16px 20px; border-bottom: 1px solid #21262d; }
        .info-section h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
        .now-playing { font-size: 0.85rem; color: #2dd4bf; display: flex; align-items: center; gap: 6px; min-height: 20px; }
        .episodes-section { padding: 20px; }
        .episodes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .episodes-header h3 { font-size: 0.9rem; color: #8b949e; font-weight: 600; }
        .ep-count { font-size: 0.75rem; background: rgba(139,148,158,0.15); color: #8b949e; padding: 4px 10px; border-radius: 6px; }
        .ep-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .ep-btn {
            aspect-ratio: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 4px;
            background: #161b22; border: 1px solid #21262d;
            border-radius: 10px; cursor: pointer; font-size: 0.75rem;
            font-weight: 600; color: #e6edf3; transition: all 0.18s ease;
        }
        .ep-btn:hover { border-color: rgba(45,212,191,0.4); background: #1c2129; }
        .ep-btn.active {
            background: #0d9488; border-color: #0d9488;
            box-shadow: 0 0 16px rgba(13,148,136,0.35);
            transform: scale(1.04);
        }
        .ep-btn .lock { font-size: 10px; opacity: 0.55; }
        .status-msg { color: #8b949e; text-align: center; padding: 40px 0; grid-column: 1/-1; }
        .loading { color: #2dd4bf; text-align: center; padding: 40px 0; grid-column: 1/-1; }
        :root { --plyr-color-main: #0d9488; }
    </style>
</head>
<body>

<header>
    <h1 id="headerTitle">Pendi Player</h1>
    <select class="quality-select" id="qualitySelect" style="display:none">
        <option value="">Kualitas</option>
    </select>
</header>

<div class="player-section">
    <video id="mainPlayer" playsinline></video>
</div>

<div class="info-section">
    <h2 id="dramaTitle">Memuat Drama...</h2>
    <div class="now-playing" id="nowPlaying">Pilih episode untuk mulai...</div>
</div>

<div class="episodes-section">
    <div class="episodes-header">
        <h3>Episodes</h3>
        <span class="ep-count" id="epCount"></span>
    </div>
    <div id="epGrid" class="ep-grid">
        <div class="loading">⏳ Mengambil data dari Firestore...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Konfigurasi Project drama-short-668af
    const firebaseConfig = {
        apiKey: "AIzaSyAbq9J5HDASVnqn13VwRAOd_u1MdEWj3bE",
        authDomain: "drama-short-668af.firebaseapp.com",
        projectId: "drama-short-668af",
        storageBucket: "drama-short-668af.firebasestorage.app",
        messagingSenderId: "216564303270",
        appId: "1:216564303270:web:13633390eb9543196a3b67"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Variabel Player & UI
    const BOOK_ID = "42000011213"; // ID drama yang ingin diputar
    const VERCEL_PROXY = "https://dracin2-neon.vercel.app/api/decrypt?url=";
    
    const grid = document.getElementById('epGrid');
    const nowPlaying = document.getElementById('nowPlaying');
    const epCountEl = document.getElementById('epCount');
    const dramaTitleEl = document.getElementById('dramaTitle');
    const qualitySelect = document.getElementById('qualitySelect');

    const player = new Plyr('#mainPlayer', {
        controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen'],
    });

    let currentEp = null;
    let activeBtn = null;

    // --- Fungsi Ambil Data Episode dari Firestore ---
    async function fetchFromFirestore() {
        try {
            // 1. Ambil Info Drama
            const dramaRef = doc(db, "dramas", BOOK_ID);
            const dramaSnap = await getDoc(dramaRef);
            
            if (dramaSnap.exists()) {
                const dramaData = dramaSnap.data();
                dramaTitleEl.textContent = dramaData.title || "Drama Tanpa Judul";
                player.poster = dramaData.cover || "";
            }

            // 2. Ambil Daftar Episode
            const epRef = doc(db, "episodes", BOOK_ID);
            const epSnap = await getDoc(epRef);

            if (!epSnap.exists()) {
                grid.innerHTML = `<div class="status-msg">❌ Data episode tidak ditemukan di Firestore!</div>`;
                return;
            }

            const chapters = epSnap.data().chapters || [];
            epCountEl.textContent = `${chapters.length} Total`;
            grid.innerHTML = '';

            chapters.forEach((ep, i) => {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                btn.innerHTML = `<span>${ep.title || (i + 1)}</span>`;
                
                btn.addEventListener('click', () => {
                    // Update UI Tombol
                    if (activeBtn) activeBtn.classList.remove('active');
                    activeBtn = btn;
                    btn.classList.add('active');

                    // Play Video melalui Proxy Vercel
                    const playUrl = ep.playUrl || ep.rawUrl;
                    if(playUrl) {
                        player.source = {
                            type: 'video',
                            sources: [{ src: VERCEL_PROXY + encodeURIComponent(playUrl), type: 'video/mp4' }]
                        };
                        nowPlaying.textContent = '▶ Memutar: ' + (ep.title || `Episode ${i+1}`);
                        player.play();
                    }
                });

                grid.appendChild(btn);

                // Auto-play episode pertama
                if (i === 0) setTimeout(() => btn.click(), 500);
            });

        } catch (err) {
            grid.innerHTML = `<div class="status-msg">❌ Error: ${err.message}</div>`;
        }
    }

    fetchFromFirestore();
</script>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
</body>
</html>
