<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pendi Drama</title>
    <style>
        :root {
            --bg:#080c10; --card:#0f1318; --border:#1e252e;
            --accent:#0d9488; --accent2:#6c63ff; --red:#e5534b;
            --text:#f0f4f8; --sub:#8b949e;
        }
        * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
        html,body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; overscroll-behavior:none; }

        /* ── Header ── */
        header {
            position:sticky; top:0; z-index:20;
            background:rgba(8,12,16,0.96); backdrop-filter:blur(14px);
            border-bottom:1px solid var(--border); padding:12px 14px;
        }
        .hdr-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
        .logo {
            font-size:1.35rem; font-weight:900; flex:1;
            background:linear-gradient(135deg,var(--accent),var(--accent2));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .hdr-btns { display:flex; gap:8px; }
        .hdr-btn {
            background:rgba(255,255,255,0.07); border:1px solid var(--border);
            color:var(--sub); padding:6px 12px; border-radius:9px;
            text-decoration:none; font-size:0.75rem; font-weight:600;
        }

        /* Search */
        .search-wrap { position:relative; }
        .search-wrap input {
            width:100%; background:rgba(255,255,255,0.07); border:1px solid var(--border);
            color:var(--text); border-radius:12px; padding:10px 16px 10px 38px;
            font-size:0.88rem; outline:none;
        }
        .search-wrap input::placeholder { color:var(--sub); }
        .search-wrap input:focus { border-color:var(--accent); }
        .search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--sub); pointer-events:none; }

        /* ── Filter chips ── */
        .filter-row {
            display:flex; gap:8px; padding:10px 14px;
            overflow-x:auto; scrollbar-width:none;
            border-bottom:1px solid var(--border);
        }
        .filter-row::-webkit-scrollbar { display:none; }
        .chip {
            flex-shrink:0; padding:5px 14px; border-radius:20px;
            border:1px solid var(--border); background:transparent;
            color:var(--sub); font-size:0.78rem; cursor:pointer; white-space:nowrap;
        }
        .chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }

        /* ── Carousel ── */
        .section-hdr { padding:12px 14px 6px; display:flex; align-items:center; justify-content:space-between; }
        .section-hdr h2 { font-size:0.82rem; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:0.05em; }

        .carousel-scroll {
            display:flex; gap:10px; padding:0 14px 4px;
            overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;
        }
        .carousel-scroll::-webkit-scrollbar { display:none; }
        .car-card {
            flex:0 0 60vw; max-width:220px; scroll-snap-align:start;
            border-radius:14px; overflow:hidden; position:relative;
            aspect-ratio:9/14; background:var(--card); cursor:pointer;
            text-decoration:none; display:block;
        }
        .car-card img { width:100%; height:100%; object-fit:cover; display:block; }
        .car-grad {
            position:absolute; bottom:0; left:0; right:0;
            background:linear-gradient(to top,rgba(0,0,0,0.92),transparent 65%);
            padding:14px 10px 12px;
        }
        .car-title { font-size:0.82rem; font-weight:700; line-height:1.3; }
        .car-meta  { font-size:0.68rem; color:rgba(255,255,255,0.6); margin-top:3px; }
        .car-badge {
            position:absolute; top:8px; left:8px;
            background:var(--accent); color:#fff; font-size:0.62rem; font-weight:700;
            padding:2px 7px; border-radius:5px;
        }

        /* ── Continue watching ── */
        .continue-scroll {
            display:flex; gap:10px; padding:0 14px 4px;
            overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;
        }
        .continue-scroll::-webkit-scrollbar { display:none; }
        .cont-card {
            flex:0 0 130px; scroll-snap-align:start;
            background:var(--card); border:1px solid var(--border);
            border-radius:12px; overflow:hidden; cursor:pointer; text-decoration:none; display:block;
        }
        .cont-thumb { position:relative; width:100%; aspect-ratio:9/6; }
        .cont-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
        .cont-prog { position:absolute; bottom:0; left:0; right:0; height:3px; background:rgba(255,255,255,0.15); }
        .cont-prog-fill { height:100%; background:var(--accent); border-radius:2px; }
        .cont-info { padding:6px 8px 8px; }
        .cont-title { font-size:0.7rem; font-weight:700; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .cont-ep    { font-size:0.62rem; color:var(--sub); margin-top:2px; }

        /* ── Drama Grid 2-col ── */
        .drama-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 14px 90px; }
        .drama-card {
            background:var(--card); border:1px solid var(--border); border-radius:14px;
            overflow:hidden; cursor:pointer; text-decoration:none; display:block;
            transition:transform 0.15s;
        }
        .drama-card:active { transform:scale(0.97); border-color:var(--accent); }
        .drama-poster { width:100%; aspect-ratio:9/13; object-fit:cover; display:block; background:#1a2030; }
        .drama-info   { padding:8px 9px 10px; }
        .drama-badge  { display:inline-block; font-size:0.6rem; font-weight:700; padding:2px 6px; border-radius:4px; margin-bottom:4px; }
        .badge-ongoing   { background:rgba(13,148,136,0.18); color:var(--accent); }
        .badge-completed { background:rgba(108,99,255,0.18); color:#a99dff; }
        .drama-title  { font-size:0.8rem; font-weight:700; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .drama-eps    { font-size:0.68rem; color:var(--sub); margin-top:3px; }

        /* Skeleton */
        @keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
        .skeleton { animation:shimmer 1.4s infinite linear; background:linear-gradient(90deg,#1a2030 25%,#232d3f 50%,#1a2030 75%); background-size:800px 100%; border-radius:8px; }
        .sk-card { background:var(--card); border-radius:14px; border:1px solid var(--border); overflow:hidden; }
        .sk-poster { width:100%; aspect-ratio:9/13; }
        .sk-line { height:11px; border-radius:4px; margin:6px 9px 0; }
        .sk-line.w60 { width:55%; }

        /* Empty state */
        .state-msg { grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--sub); }
        .state-msg .ico { font-size:2.5rem; display:block; margin-bottom:12px; }
        .state-msg p { font-size:0.88rem; line-height:1.6; }

        /* ── Bottom Nav ── */
        .bnav {
            position:fixed; bottom:0; left:0; right:0; z-index:30;
            background:rgba(8,12,16,0.96); backdrop-filter:blur(14px);
            border-top:1px solid var(--border);
            display:flex; padding:6px 0 env(safe-area-inset-bottom,6px);
        }
        .bnav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px; cursor:pointer; text-decoration:none; }
        .bnav-ico   { font-size:1.3rem; }
        .bnav-label { font-size:0.6rem; color:var(--sub); font-weight:600; }
        .bnav-item.active .bnav-label { color:var(--accent); }
    </style>
</head>
<body>

<header>
    <div class="hdr-row">
        <span class="logo">🎬 Pendi</span>
        <div class="hdr-btns">
            <a class="hdr-btn" href="admin.html">⚙️ Admin</a>
        </div>
    </div>
    <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="search" placeholder="Cari drama..." autocomplete="off" oninput="onSearch()">
    </div>
</header>

<!-- Filter chips -->
<div class="filter-row">
    <button class="chip active" onclick="setFilter('all',this)">Semua</button>
    <button class="chip" onclick="setFilter('Ongoing',this)">🔥 Ongoing</button>
    <button class="chip" onclick="setFilter('Completed',this)">✅ Selesai</button>
    <button class="chip" id="chip-fav" onclick="setFilter('fav',this)">❤️ Favorit</button>
</div>

<!-- Continue watching -->
<div id="continueSection" style="display:none">
    <div class="section-hdr"><h2>▶ Lanjutkan Menonton</h2></div>
    <div class="continue-scroll" id="continueScroll"></div>
</div>

<!-- Featured carousel -->
<div id="featuredSection" style="display:none">
    <div class="section-hdr"><h2>⭐ Unggulan</h2></div>
    <div class="carousel-scroll" id="carouselScroll"></div>
</div>

<!-- Drama grid -->
<div class="section-hdr"><h2>🎭 Semua Drama</h2></div>
<div class="drama-grid" id="dramaGrid">
    ${Array(6).fill(0).map(()=>`
    <div class="sk-card">
        <div class="skeleton sk-poster"></div>
        <div class="sk-line skeleton"></div>
        <div class="sk-line w60 skeleton" style="margin-bottom:8px"></div>
    </div>`).join('')}
</div>

<!-- Bottom nav -->
<nav class="bnav">
    <a class="bnav-item active" href="index.html"><span class="bnav-ico">🏠</span><span class="bnav-label">Beranda</span></a>
    <span class="bnav-item" onclick="document.getElementById('searchInput').focus()"><span class="bnav-ico">🔍</span><span class="bnav-label">Cari</span></span>
    <span class="bnav-item" onclick="setFilter('fav',document.getElementById('chip-fav'))"><span class="bnav-ico">❤️</span><span class="bnav-label">Favorit</span></span>
    <a class="bnav-item" href="admin.html"><span class="bnav-ico">⚙️</span><span class="bnav-label">Admin</span></a>
</nav>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const db = getFirestore(initializeApp({
    apiKey:"AIzaSyAbq9J5HDASVnqn13VwRAOd_u1MdEWj3bE",
    authDomain:"drama-short-668af.firebaseapp.com",
    projectId:"drama-short-668af",
    storageBucket:"drama-short-668af.firebasestorage.app",
    messagingSenderId:"216564303270",
    appId:"1:216564303270:web:13633390eb9543196a3b67"
}));

let all = [], activeFilter = 'all';

function isFav(bookId) { return !!localStorage.getItem('fav_'+bookId); }
function getProgress(bookId) { try { return JSON.parse(localStorage.getItem('progress_'+bookId)||'{}'); } catch { return {}; } }

function badgeHtml(s) {
    return s === 'Ongoing'
        ? '<span class="drama-badge badge-ongoing">Ongoing</span>'
        : '<span class="drama-badge badge-completed">Selesai</span>';
}
function cardHtml(d) {
    return `<a class="drama-card" href="player.html?id=${d.bookId}">
        <img class="drama-poster" src="${d.cover||''}" alt="${d.title}" loading="lazy" onerror="this.style.background='#1a2030'">
        <div class="drama-info">
            ${badgeHtml(d.status||'Unknown')}
            <div class="drama-title">${d.title||'Tanpa Judul'}</div>
            <div class="drama-eps">${d.totalEps||0} Episode</div>
        </div>
    </a>`;
}

function renderGrid(list) {
    const grid = document.getElementById('dramaGrid');
    if (!list.length) {
        grid.innerHTML = '<div class="state-msg"><span class="ico">🔍</span><p>Tidak ada drama ditemukan.</p></div>';
        return;
    }
    grid.innerHTML = list.map(cardHtml).join('');
}

function buildContinue() {
    const keys = Object.keys(localStorage).filter(k=>k.startsWith('progress_'));
    if (!keys.length) return;
    const scroll = document.getElementById('continueScroll');
    const items  = [];
    keys.forEach(k=>{
        const bookId = k.replace('progress_','');
        const prog   = getProgress(bookId);
        const drama  = all.find(d=>d.bookId===bookId);
        if (!drama||!prog.time) return;
        const pct = prog.duration ? Math.round((prog.time/prog.duration)*100) : 0;
        items.push(`<a class="cont-card" href="player.html?id=${bookId}">
            <div class="cont-thumb">
                <img src="${drama.cover||''}" alt="${drama.title}" onerror="this.style.background='#1a2030'">
                <div class="cont-prog"><div class="cont-prog-fill" style="width:${pct}%"></div></div>
            </div>
            <div class="cont-info">
                <div class="cont-title">${drama.title}</div>
                <div class="cont-ep">EP ${(prog.epIndex||0)+1}</div>
            </div>
        </a>`);
    });
    if (!items.length) return;
    scroll.innerHTML = items.join('');
    document.getElementById('continueSection').style.display='block';
}

function applyFilter() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    let list = all;
    if (activeFilter==='fav')       list = list.filter(d=>isFav(d.bookId));
    else if (activeFilter!=='all')  list = list.filter(d=>d.status===activeFilter);
    if (q) list = list.filter(d=>(d.title||'').toLowerCase().includes(q));
    renderGrid(list);
    const showNormal = !q && activeFilter==='all';
    document.getElementById('featuredSection').style.display  = showNormal ? 'block':'none';
    document.getElementById('continueSection').style.display  = showNormal ? '' :'none';
}

window.setFilter = (f,btn) => {
    activeFilter = f;
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    applyFilter();
};
window.onSearch = applyFilter;

async function load() {
    const snap = await getDocs(collection(db,'dramas'));
    all = snap.docs.map(d=>({bookId:d.id,...d.data()}));
    all.sort((a,b)=>(b.lastScraped?.seconds||0)-(a.lastScraped?.seconds||0));

    if (!all.length) {
        document.getElementById('dramaGrid').innerHTML =
            '<div class="state-msg"><span class="ico">📭</span><p>Belum ada drama.<br>Gunakan Admin Panel untuk scrape.</p></div>';
        return;
    }

    // Featured carousel
    const featured = all.filter(d=>d.cover).slice(0,6);
    if (featured.length) {
        document.getElementById('featuredSection').style.display='block';
        document.getElementById('carouselScroll').innerHTML = featured.map(d=>`
            <a class="car-card" href="player.html?id=${d.bookId}">
                <img src="${d.cover}" alt="${d.title}" loading="lazy">
                <div class="car-grad">
                    <div class="car-title">${d.title}</div>
                    <div class="car-meta">${d.totalEps||0} Eps · ${d.status||''}</div>
                </div>
                <span class="car-badge">Drama</span>
            </a>`).join('');
    }

    renderGrid(all);
    buildContinue();
}

load().catch(e=>{
    document.getElementById('dramaGrid').innerHTML =
        `<div class="state-msg"><span class="ico">❌</span><p>Gagal: ${e.message}</p></div>`;
});
</script>
</body>
</html>
